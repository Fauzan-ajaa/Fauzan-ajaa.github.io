<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("loginForm");
        if (!form) return;

        form.addEventListener("submit", function (e) {
          e.preventDefault();

          let username = document.getElementById("loginUsername").value;
          let password = document.getElementById("loginPassword").value;

          let user = JSON.parse(localStorage.getItem("user"));

          if (!user) {
            alert("Belum ada akun terdaftar!");
            return;
          }

          if (username === user.nama && password === user.password) {
            alert("Login Berhasil!");
            window.location.href = "index.html";
          } else {
            alert("Username atau Password salah!");
          }
        });
      });
    </script>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        background-image: url("img/login-bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }
    </style>
  </head>

  <body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px">
      <h3 class="text-center">Login</h3>
      <form id="loginForm">
        <input type="text" id="loginUsername" class="form-control mt-3" placeholder="Username" />
        <input type="password" id="loginPassword" class="form-control mt-3" placeholder="Password" />

        <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
        <a href="register.html" class="text-primary d-block text-center mt-3" style="text-decoration: none"></a>
      </form>

      <p class="text-center mt-3">Belum punya akun? <a href="register.html">Daftar</a></p>
    </div>

    <script src="script.js"></script>

    <footer class="bg-dark text-white text-center py-3 position-fixed bottom-0 w-100">@Copyright by 241010010_Fauzan Kamil Amirulloh_TRPL</footer>
  </body>
</html>
