<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px">
      <h3 class="text-center">Login</h3>

      <input type="text" id="user" class="form-control mt-3" placeholder="Username" />
      <input type="password" id="pass" class="form-control mt-3" placeholder="Password" />

      <button class="btn btn-primary w-100 mt-3" onclick="login()">Login</button>

      <p class="text-center mt-3">Belum punya akun? <a href="register.html">Daftar</a></p>
    </div>

    <script src="script.js"></script>

    <footer class="bg-dark text-white text-center py-3 position-fixed bottom-0 w-100">@Copyright by NIM_NAMA_MAHASISWA_KELAS</footer>
  </body>
</html>
